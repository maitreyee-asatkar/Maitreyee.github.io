# Azure App Service deployment for the AI Security Dashboard

name: Build and deploy Node.js app to Azure Web App - maitreyee-ai-security-dashboard

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"

      - name: Validate dashboard
        working-directory: projects/ai-security-dashboard
        run: |
          node --check server.js
          node --check app.js

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_7F07928A82EA4122B4A5BAE29534074D }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_ED43D92264A1405D986E94E64D541089 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_A3386457E81E493584B8196428A1A391 }}

      - name: Deploy dashboard
        uses: azure/webapps-deploy@v3
        with:
          app-name: "maitreyee-ai-security-dashboard"
          slot-name: "Production"
          package: "./projects/ai-security-dashboard"
