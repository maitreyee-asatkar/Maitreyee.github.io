name: SentinelRAG CI
on:
  push:
    paths: ["projects/sentinel-rag/**"]
  pull_request:
    paths: ["projects/sentinel-rag/**"]
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/sentinel-rag
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m compileall app
      - run: python -c "from app.prompts import SYSTEM_PROMPT; assert 'retrieved evidence' in SYSTEM_PROMPT"
